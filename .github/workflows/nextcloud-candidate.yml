name: nextcloud-candidate
on: [push, pull_request]
permissions: {contents: read}
jobs:
  candidate:
    runs-on: ubuntu-24.04
    env:
      KUBECONFIG: /dev/null
      ACTIVE_PORTAL_APP_CHECKOUT: ${{ github.workspace }}/.inputs/portal-active
      TENANT_APP_CHECKOUT: ${{ github.workspace }}/.inputs/portal
      NEXTCLOUD_APP_CHECKOUT: ${{ github.workspace }}/.inputs/nextcloud
      NEXTCLOUD_ROLLBACK_APP_CHECKOUT: ${{ github.workspace }}/.inputs/nextcloud-rollback
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
    - uses: azure/setup-helm@v4.3.1
      with:
        version: v3.19.0
    - name: Verify the published physical Portal fixture before checkout
      env:
        GH_TOKEN: ${{ github.token }}
      run: scripts/verify-release-ref.sh perkforge/perkforge-tenant-portal v2.0.0 e8de0e3cf68d01860b0addaa3b38e24f928d5ff6
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      with:
        repository: perkforge/perkforge-tenant-portal
        ref: v2.0.0
        path: .inputs/portal
        fetch-depth: 0
        persist-credentials: false
    - name: Read immutable active Portal release evidence
      id: portal_active
      run: |
        python3 - <<'PYTHON'
        import json, os
        release = json.load(open('release-evidence.json'))['dependencies']['portalActive']
        with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
            for key in ('repository', 'tag', 'resolvedCommit'):
                output.write(key + '=' + release[key] + '\n')
        PYTHON
    - name: Verify active Portal release before checkout
      env:
        GH_TOKEN: ${{ github.token }}
        APP_REPOSITORY: ${{ steps.portal_active.outputs.repository }}
        APP_TAG: ${{ steps.portal_active.outputs.tag }}
        APP_COMMIT: ${{ steps.portal_active.outputs.resolvedCommit }}
      run: scripts/verify-release-ref.sh "$APP_REPOSITORY" "$APP_TAG" "$APP_COMMIT"
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      with:
        repository: ${{ steps.portal_active.outputs.repository }}
        ref: ${{ steps.portal_active.outputs.tag }}
        path: .inputs/portal-active
        fetch-depth: 0
        persist-credentials: false
    - name: Verify the published Nextcloud candidate tag before checkout
      env:
        GH_TOKEN: ${{ github.token }}
      run: scripts/verify-release-ref.sh perkforge/perkforge-tenant-nextcloud v1.1.3 c079cdff6a859064805abfa887cee67caaf8d255
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      with:
        repository: perkforge/perkforge-tenant-nextcloud
        ref: v1.1.3
        path: .inputs/nextcloud
        fetch-depth: 0
        persist-credentials: false
    # Explicit legacy public-image rollback fixture; never the selected candidate.
    - name: Verify the published legacy rollback tag before checkout
      env:
        GH_TOKEN: ${{ github.token }}
      run: scripts/verify-release-ref.sh perkforge/perkforge-tenant-nextcloud v1.0.4 9c48e8d97c596533a806dcb78e33b1932d5ef04a
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      with:
        repository: perkforge/perkforge-tenant-nextcloud
        ref: v1.0.4
        path: .inputs/nextcloud-rollback
        persist-credentials: false
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: '1.27.3'
        cache-dependency-path: tests/nextcloud-cel/go.sum
    - name: Fetch exact upstream schemas and chart fixtures
      shell: bash
      run: |
        set -euo pipefail
        python3 -m pip install PyYAML==6.0.3 ansible-core==2.19.3
        mkdir -p "$RUNNER_TEMP/nextcloud-schemas"
        bash tests/nextcloud-cel/fetch-schemas.sh "$RUNNER_TEMP/nextcloud-schemas"
        curl --fail --location --retry 3 --connect-timeout 20 --max-time 120 -o "$RUNNER_TEMP/nextcloud-9.4.1.tgz" https://github.com/nextcloud/helm/releases/download/nextcloud-9.4.1/nextcloud-9.4.1.tgz
        echo "e3d768864800bcc23eb66e6f65cbf5f0545b1506cf8c65f55a91d21af3bad4bf  $RUNNER_TEMP/nextcloud-9.4.1.tgz" | sha256sum -c -
        echo "NEXTCLOUD_CHART=$RUNNER_TEMP/nextcloud-9.4.1.tgz" >> "$GITHUB_ENV"
        echo "NEXTCLOUD_OPENAPI=$RUNNER_TEMP/nextcloud-schemas/openapi.json" >> "$GITHUB_ENV"
        echo "NEXTCLOUD_CRD_DIR=$RUNNER_TEMP/nextcloud-schemas" >> "$GITHUB_ENV"
    - name: Check candidate contracts and native CEL with no cluster access
      run: |
        python3 -m unittest discover -s tests -p 'test_*.py' -v
        cd tests/nextcloud-cel
        go test -count=1 -v .
