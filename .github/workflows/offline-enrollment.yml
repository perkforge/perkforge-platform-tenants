name: offline-enrollment
on:
  push:
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      KUBECONFIG: /dev/null
      ACTIVE_PORTAL_APP_CHECKOUT: ${{ github.workspace }}/.inputs/portal-active
    steps:
    - uses: actions/checkout@v4
    - uses: azure/setup-helm@v4.3.1
      with:
        version: v3.19.0
    - run: python3 -m pip install PyYAML==6.0.3
    - name: Check derived enrollment inventory
      run: |
        python3 scripts/test_enrollment_inventory.py
        python3 scripts/enrollment_inventory.py --check
    # Test fixture selection only; this is not tenant discovery or a config generator.
    - name: Read reviewed app release evidence
      id: app
      run: |
        python3 - <<'PYTHON'
        import os
        from scripts.test_enrollment_release import selected_release
        release = selected_release()
        with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
            for key in ('repository', 'tag', 'resolvedCommit'):
                output.write(key + '=' + release[key] + '\n')
        PYTHON
    - name: Reject missing or moved release before checkout
      env:
        GH_TOKEN: ${{ github.token }}
        APP_REPOSITORY: ${{ steps.app.outputs.repository }}
        APP_TAG: ${{ steps.app.outputs.tag }}
        APP_COMMIT: ${{ steps.app.outputs.resolvedCommit }}
      run: |
        set -euo pipefail
        scripts/verify-release-ref.sh "$APP_REPOSITORY" "$APP_TAG" "$APP_COMMIT" | tee -a "$GITHUB_STEP_SUMMARY"
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      with:
        repository: ${{ steps.app.outputs.repository }}
        ref: ${{ steps.app.outputs.tag }}
        path: .inputs/app
        fetch-depth: 0
        persist-credentials: false
    - name: Read immutable active Portal release evidence
      id: portal_active
      run: |
        python3 - <<'PYTHON'
        import json, os
        release = json.load(open('release-evidence.json'))['dependencies']['portalActive']
        with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
            for key in ('repository', 'tag', 'resolvedCommit'):
                output.write(key + '=' + release[key] + '\n')
        PYTHON
    - name: Verify active Portal release before checkout
      env:
        GH_TOKEN: ${{ github.token }}
        APP_REPOSITORY: ${{ steps.portal_active.outputs.repository }}
        APP_TAG: ${{ steps.portal_active.outputs.tag }}
        APP_COMMIT: ${{ steps.portal_active.outputs.resolvedCommit }}
      run: scripts/verify-release-ref.sh "$APP_REPOSITORY" "$APP_TAG" "$APP_COMMIT"
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      with:
        repository: ${{ steps.portal_active.outputs.repository }}
        ref: ${{ steps.portal_active.outputs.tag }}
        path: .inputs/portal-active
        fetch-depth: 0
        persist-credentials: false
    - name: Verify actual released app paths, context and paused scope
      env:
        TENANT_APP_CHECKOUT: ${{ github.workspace }}/.inputs/app
      run: python3 scripts/test_enrollment_release.py
    - name: Test gated registry delivery with dummy inputs only
      run: python3 scripts/test_registry_delivery.py
    - name: Test exact Keycloak server attribute compatibility offline
      run: python3 scripts/test_keycloak_attributes.py
    - name: Test full client role mapping against isolated HTTPS fixture
      run: python3 scripts/test_portal_identity_api.py
    - name: Build explicit cluster selections without API access
      run: |
        kubectl version --client
        kubectl kustomize clusters/local > "$RUNNER_TEMP/enrollment-local.yaml"
        kubectl kustomize clusters/dev > "$RUNNER_TEMP/enrollment-dev.yaml"
    - name: Verify an explicitly empty cluster enrolls nothing
      run: |
        mkdir -p "$RUNNER_TEMP/enrollment-empty"
        printf 'apiVersion: kustomize.config.k8s.io/v1beta1\nkind: Kustomization\nresources: []\n' > "$RUNNER_TEMP/enrollment-empty/kustomization.yaml"
        kubectl kustomize "$RUNNER_TEMP/enrollment-empty" > "$RUNNER_TEMP/enrollment-empty.yaml"
        test ! -s "$RUNNER_TEMP/enrollment-empty.yaml"
