# Offline only. No Kubernetes API, credentials, image build or source promotion.
- name: Render explicitly approved automatic identity trigger
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    automatic_identity_render: false
    automatic_identity_foundation_approved: false
    automatic_identity_output: ''
    automatic_identity_context: ''
    automatic_identity_enrollment_revision: ''
    automatic_identity_image: ''
    automatic_identity_namespace: ''
    automatic_identity_receipt_claim: ''
    automatic_identity_inputs_configmap: ''
    automatic_identity_inputs_sha256: ''
    automatic_identity_worker_node: ''
    automatic_identity_credentials_secret: ''
    automatic_identity_worker_sa: ''
    automatic_identity_pull_secret: ''
    automatic_identity_reconciler_sa: ''
    automatic_identity_source_name: ''
    automatic_identity_source_path: ''
    automatic_identity_cpu_request: ''
    automatic_identity_memory_request: ''
    automatic_identity_cpu_limit: ''
    automatic_identity_memory_limit: ''
  tasks:
  - name: Default and check mode are inert
    ansible.builtin.debug:
      msg: 'Offline renderer only; no executor image or foundation is supplied by this prototype.'
  - when: automatic_identity_render | bool and not ansible_check_mode
    block:
    - name: Read platform-owned explicit selection
      ansible.builtin.set_fact:
        selection: '{{ lookup("file", playbook_dir + "/../../contracts/tenant-identity-v1.json") | from_json }}'
    - name: Refuse absent selection, provenance, approved foundation or resource inputs
      ansible.builtin.assert:
        that:
        - automatic_identity_foundation_approved is sameas true
        - automatic_identity_output is match('^/[^\n]+$')
        - selection.schemaVersion == 1
        - selection.kind == 'explicit-tenant-identity-selection'
        - selection.platformRepository == 'perkforge/perkforge-platform'
        - selection.platformRevision is string
        - selection.platformRevision is match('^[0-9a-f]{40}$')
        - automatic_identity_enrollment_revision is match('^[0-9a-f]{40}$')
        - automatic_identity_context is match('^[a-z][a-z0-9-]{0,30}$')
        - automatic_identity_context in selection.contexts
        - selection.contexts[automatic_identity_context].canonicalContext == 'big-bang-bootstrap/configuration/authorization/contexts/' + automatic_identity_context + '.yaml'
        - selection.contexts[automatic_identity_context].gitlabGroupPath == 'tenants/' + automatic_identity_context
        - automatic_identity_inputs_sha256 is match('^[0-9a-f]{64}$')
        - automatic_identity_worker_node is match('^[a-z0-9][a-z0-9.-]{0,62}$')
        - automatic_identity_image is match('^[a-z0-9][a-z0-9./_-]+@sha256:[0-9a-f]{64}$')
        - automatic_identity_source_path is match('^\./[a-zA-Z0-9/_-]+$')
        - automatic_identity_cpu_request is match('^[1-9][0-9]*m$')
        - automatic_identity_cpu_limit is match('^[1-9][0-9]*m$')
        - automatic_identity_memory_request is match('^[1-9][0-9]*Mi$')
        - automatic_identity_memory_limit is match('^[1-9][0-9]*Mi$')
        - (automatic_identity_cpu_limit[:-1] | int) >= (automatic_identity_cpu_request[:-1] | int)
        - (automatic_identity_memory_limit[:-2] | int) >= (automatic_identity_memory_request[:-2] | int)
    - name: Validate exact foundation reference names
      ansible.builtin.assert:
        that: item is match('^[a-z][a-z0-9-]{0,62}$')
      loop: ['{{ automatic_identity_namespace }}', '{{ automatic_identity_receipt_claim }}', '{{ automatic_identity_inputs_configmap }}', '{{ automatic_identity_credentials_secret }}', '{{ automatic_identity_worker_sa }}', '{{ automatic_identity_reconciler_sa }}', '{{ automatic_identity_source_name }}', '{{ automatic_identity_pull_secret }}']
    - name: Bind immutable invocation identity
      ansible.builtin.set_fact:
        invocation: '{{ {"context": automatic_identity_context, "platform": selection.platformRevision, "enrollment": automatic_identity_enrollment_revision, "image": automatic_identity_image, "inputs": automatic_identity_inputs_configmap, "inputsSHA256": automatic_identity_inputs_sha256, "workerNode": automatic_identity_worker_node, "credentials": automatic_identity_credentials_secret, "namespace": automatic_identity_namespace, "claim": automatic_identity_receipt_claim, "worker": automatic_identity_worker_sa, "pull": automatic_identity_pull_secret, "cpuRequest": automatic_identity_cpu_request, "cpuLimit": automatic_identity_cpu_limit, "memoryRequest": automatic_identity_memory_request, "memoryLimit": automatic_identity_memory_limit} | to_json | hash("sha256") }}'
    - ansible.builtin.file:
        path: '{{ automatic_identity_output }}/job'
        state: directory
        mode: '0700'
    - ansible.builtin.template:
        src: job.yaml.j2
        dest: '{{ automatic_identity_output }}/job/job.yaml'
        mode: '0600'
    - ansible.builtin.copy:
        dest: '{{ automatic_identity_output }}/job/kustomization.yaml'
        mode: '0600'
        content: "apiVersion: kustomize.config.k8s.io/v1beta1\nkind: Kustomization\nresources: [job.yaml]\n"
    - ansible.builtin.template:
        src: reconcile.yaml.j2
        dest: '{{ automatic_identity_output }}/reconcile.yaml'
        mode: '0600'
