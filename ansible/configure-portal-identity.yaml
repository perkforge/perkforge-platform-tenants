- name: Configure only the owned portal client in the existing local realm
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    portal_identity_apply: false
    portal_subject_scope_apply: false
    portal_identity_access_policy: tenant-reader
    enrollment_tag: UNCONFIGURED
    sso_client_username_file: /UNCONFIGURED/recovery-username
    sso_client_password_file: /UNCONFIGURED/recovery-password
    portal_private_dir: /UNCONFIGURED/portal
    identity_ca_sha256: UNCONFIGURED
    identity_ca_file: /UNCONFIGURED/identity-ca.crt
    identity_url: https://keycloak.perkforge.home.arpa/auth
    portal_api: '{{ identity_url }}/admin/realms/perkforge'
  module_defaults:
    ansible.builtin.uri:
      validate_certs: true
      ca_path: '{{ identity_ca_file }}'
      follow_redirects: none
      use_netrc: false
      use_proxy: false
      timeout: 20
  tasks:
  - name: Refuse another identity endpoint
    ansible.builtin.assert:
      that:
      - portal_identity_access_policy in ['tenant-reader', 'platform-admins']
      - identity_url == 'https://keycloak.perkforge.home.arpa/auth'
      - portal_api == identity_url ~ '/admin/realms/perkforge'
  - name: Default and check mode read no credentials and call no API
    ansible.builtin.debug:
      msg: 'Portal client configuration={{ portal_identity_apply | bool }}; check={{ ansible_check_mode }}'
  - name: Configure only the separately approved owned portal client
    when: portal_identity_apply | bool and not ansible_check_mode
    no_log: true
    block:
    - name: Verify published enrollment code
      ansible.builtin.include_tasks: verify-release.yaml
    - name: Require reviewed public CA before reading credentials
      ansible.builtin.include_tasks: portal-public-ca.yaml
    - name: Use existing bootstrap access without logging credentials or tokens
      ansible.builtin.include_tasks: portal-identity-inputs.yaml
      no_log: true
    - name: Configure the owned client for the selected access policy
      ansible.builtin.include_tasks: portal-identity-client.yaml
      no_log: true
    - name: Verify the existing exact admin group without membership changes
      ansible.builtin.include_tasks: portal-identity-group.yaml
      no_log: true
    - name: Bind only the existing exact admin group to the app-specific role
      ansible.builtin.include_tasks: portal-identity-role.yaml
      no_log: true
      when: portal_identity_access_policy == 'tenant-reader'
