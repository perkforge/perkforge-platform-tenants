- name: Inspect private input directories without following links
  ansible.builtin.stat: {path: '{{ item }}', follow: false}
  loop: ['{{ sso_client_username_file | dirname }}', '{{ sso_client_password_file | dirname }}', '{{ portal_private_dir }}']
  register: portal_directories
- name: Require owned private directories before reading credentials
  ansible.builtin.assert:
    that:
    - item.stat.isdir | default(false)
    - not (item.stat.islnk | default(false))
    - item.stat.mode == '0700'
    - item.stat.uid == lookup('pipe', 'id -u') | int
  loop: '{{ portal_directories.results }}'
- name: Inspect exact credential inputs without following links
  ansible.builtin.stat: {path: '{{ item }}', follow: false}
  loop: ['{{ sso_client_username_file }}', '{{ sso_client_password_file }}', '{{ portal_private_dir }}/client-secret']
  register: portal_inputs
- name: Require private owned nonempty regular files
  ansible.builtin.assert:
    that:
    - item.stat.isreg | default(false)
    - not (item.stat.islnk | default(false))
    - item.stat.mode == '0600'
    - item.stat.uid == lookup('pipe', 'id -u') | int
    - item.stat.size > 0
  loop: '{{ portal_inputs.results }}'
- name: Authenticate existing bootstrap admin over verified HTTPS
  ansible.builtin.uri:
    url: '{{ identity_url }}/realms/master/protocol/openid-connect/token'
    method: POST
    body_format: form-urlencoded
    body:
      client_id: admin-cli
      grant_type: password
      username: "{{ lookup('ansible.builtin.file', sso_client_username_file) | trim }}"
      password: "{{ lookup('ansible.builtin.file', sso_client_password_file) | trim }}"
  register: portal_admin_session
- name: Keep token in private task state only
  ansible.builtin.set_fact:
    portal_headers: {Authorization: 'Bearer {{ portal_admin_session.json.access_token }}'}
