# Offline renderer only. A separately approved operator applies the reviewed output.
- name: Render bounded CNPG API egress from private endpoint inputs
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    nextcloud_api_reviewed: false
    nextcloud_api_cidrs: []
    nextcloud_api_output: /UNCONFIGURED/network.yaml
  tasks:
  - ansible.builtin.assert:
      that:
      - nextcloud_api_reviewed | bool
      - nextcloud_api_cidrs is sequence and nextcloud_api_cidrs is not string
      - nextcloud_api_cidrs | length > 0 and nextcloud_api_cidrs | length <= 4
      - nextcloud_api_output is match('^/') and not nextcloud_api_output.startswith('/UNCONFIGURED/')
  - ansible.builtin.assert:
      that: item is match('^([0-9]{1,3}[.]){3}[0-9]{1,3}/32$')
    loop: '{{ nextcloud_api_cidrs }}'
    no_log: true
  - ansible.builtin.command:
      argv: [python3, -c, 'import ipaddress,sys; [ipaddress.IPv4Network(x, strict=True) for x in sys.argv[1:]]', '{{ item }}']
    loop: '{{ nextcloud_api_cidrs }}'
    changed_when: false
    no_log: true
  - ansible.builtin.stat: {path: '{{ nextcloud_api_output }}', follow: false}
    register: api_output
  - ansible.builtin.stat: {path: '{{ nextcloud_api_output | dirname }}', follow: false}
    register: api_parent
  - ansible.builtin.assert:
      that:
      - not api_output.stat.exists
      - api_parent.stat.isdir | default(false)
      - not api_parent.stat.islnk | default(false)
      - api_parent.stat.mode == '0700'
      - api_parent.stat.uid == lookup('pipe', 'id -u') | int
  - ansible.builtin.template:
      src: nextcloud-api-policy.yaml.j2
      dest: '{{ nextcloud_api_output }}'
      mode: '0600'
    when: not ansible_check_mode
