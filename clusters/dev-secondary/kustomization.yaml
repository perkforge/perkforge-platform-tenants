apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../tenants/portal
patches:
- target:
    group: kustomize.toolkit.fluxcd.io
    kind: Kustomization
    name: tenant-portal
  patch: |-
    - op: replace
      path: /spec/path
      value: ./gitops/clusters/dev-secondary
commonAnnotations:
  example.perkforge.io/cluster: dev-secondary
  example.perkforge.io/environment: dev
  example.perkforge.io/profile: il5
