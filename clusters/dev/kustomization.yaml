apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../tenants/portal
patches:
- target:
    group: kustomize.toolkit.fluxcd.io
    kind: Kustomization
    name: tenant-portal
  patch: |-
    - op: replace
      path: /spec/path
      value: ./gitops/clusters/dev
commonAnnotations:
  platform.perkforge.io/cluster: dev
  platform.perkforge.io/environment: dev
  platform.perkforge.io/profile: il2
