# Explicit integrated pilot selection; prerequisite custody/routing remains operator-owned.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../local-nextcloud
- ../local
patches:
- target: {group: source.toolkit.fluxcd.io, kind: GitRepository, name: tenant-portal, namespace: tenant-portal-config}
  patch: |-
    - op: replace
      path: /spec/ref/tag
      value: v2.3.0
    - op: replace
      path: /spec/suspend
      value: false
- target: {group: kustomize.toolkit.fluxcd.io, kind: Kustomization, name: tenant-portal, namespace: tenant-portal-config}
  patch: |-
    - op: replace
      path: /spec/suspend
      value: false
