# Nextcloud-only private-image candidate. Effective only after reviewed platform promotion.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../tenants/nextcloud
patches:
- target: {kind: GitRepository, name: tenant-nextcloud}
  patch: |-
    - op: remove
      path: /spec/secretRef
    - op: replace
      path: /spec/ref/tag
      value: v1.1.0
    - op: replace
      path: /spec/suspend
      value: false
- target: {kind: HelmRepository, name: nextcloud-upstream}
  patch: |-
    - op: replace
      path: /spec/suspend
      value: false
- target: {kind: Kustomization, name: tenant-nextcloud}
  patch: |-
    - op: replace
      path: /spec/suspend
      value: false
commonAnnotations:
  platform.perkforge.io/cluster: local
  platform.perkforge.io/environment: local
  platform.perkforge.io/profile: il2
