apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: tenant-portal-config
resources:
- ../../tenants/portal
patches:
- target:
    group: kustomize.toolkit.fluxcd.io
    kind: Kustomization
    name: tenant-portal
  patch: |-
    - op: replace
      path: /spec/path
      value: ./gitops/clusters/local
- target: {kind: Kustomization, name: tenant-portal}
  patch: |-
    - op: replace
      path: /spec/targetNamespace
      value: tenant-portal-config
- target: {kind: GitRepository, name: tenant-portal}
  patch: |-
    - op: remove
      path: /spec/secretRef
- target: {kind: GitRepository, name: tenant-portal}
  patch: |-
    - op: replace
      path: /spec/suspend
      value: false
- target: {kind: Kustomization, name: tenant-portal}
  patch: |-
    - op: replace
      path: /spec/suspend
      value: false
commonAnnotations:
  platform.perkforge.io/cluster: local
  platform.perkforge.io/environment: local
  platform.perkforge.io/profile: il2
