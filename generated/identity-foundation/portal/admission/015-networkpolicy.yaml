apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: identity-worker-egress
  labels:
    platform.perkforge.io/owner: tenant-identity-foundation-v1
  namespace: tenant-identity-attestor
spec:
  podSelector:
    matchLabels:
      platform.perkforge.io/identity-phase: 'true'
  policyTypes:
  - Egress
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
  - to:
    - ipBlock:
        cidr: 192.168.1.102/32
    ports:
    - protocol: TCP
      port: 443
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          app.kubernetes.io/instance: rke2-traefik-kube-system
          app.kubernetes.io/name: rke2-traefik
    ports:
    - protocol: TCP
      port: 8443
  - to:
    - ipBlock:
        cidr: 10.43.0.1/32
    ports:
    - protocol: TCP
      port: 443
  - to:
    - ipBlock:
        cidr: 192.168.1.101/32
    ports:
    - protocol: TCP
      port: 6443
