apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: identity-declaration-reconciler
  labels:
    platform.perkforge.io/owner: tenant-identity-foundation-v1
  namespace: flux-system
rules:
- apiGroups:
  - kustomize.toolkit.fluxcd.io
  resources:
  - kustomizations
  verbs:
  - create
- apiGroups:
  - kustomize.toolkit.fluxcd.io
  resources:
  - kustomizations
  verbs:
  - get
  - patch
  - update
  resourceNames:
  - identity-portal-foundation
  - identity-portal-attest
  - identity-portal-memberships
