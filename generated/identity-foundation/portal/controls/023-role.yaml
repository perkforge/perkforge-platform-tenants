apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: eso-identity-reader
  labels:
    platform.perkforge.io/owner: tenant-identity-foundation-v1
  namespace: tenant-identity-attestor
rules:
- apiGroups:
  - ''
  resources:
  - secrets
  verbs:
  - get
  - update
  - patch
  resourceNames:
  - isolated-attestor
- apiGroups:
  - ''
  resources:
  - serviceaccounts/token
  verbs:
  - create
  resourceNames:
  - eso-identity-reader
- apiGroups:
  - ''
  resources:
  - configmaps
  verbs:
  - get
  resourceNames:
  - identity-openbao-ca
- apiGroups:
  - external-secrets.io
  resources:
  - externalsecrets
  verbs:
  - patch
  resourceNames:
  - eso-identity-reader
- apiGroups:
  - external-secrets.io
  resources:
  - externalsecrets/status
  verbs:
  - update
  - patch
  resourceNames:
  - eso-identity-reader
- apiGroups:
  - external-secrets.io
  resources:
  - secretstores/status
  verbs:
  - patch
  resourceNames:
  - eso-identity-reader
