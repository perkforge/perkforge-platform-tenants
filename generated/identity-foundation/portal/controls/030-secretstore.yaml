apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: eso-identity-keycloak
  labels:
    platform.perkforge.io/owner: tenant-identity-foundation-v1
  namespace: tenant-identity-attestor
spec:
  controller: perkforge
  provider:
    vault:
      server: https://openbao.perkforge.home.arpa
      path: platform
      version: v2
      caProvider:
        type: ConfigMap
        name: identity-openbao-ca
        key: ca.crt
      auth:
        kubernetes:
          mountPath: kubernetes-eso
          role: eso-identity-keycloak
          serviceAccountRef:
            name: eso-identity-keycloak
            audiences:
            - openbao-eso
