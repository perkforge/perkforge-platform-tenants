apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: identity-portal-foundation-admission
  namespace: flux-system
spec:
  interval: 5m
  timeout: 5m
  path: ./generated/identity-foundation/portal/admission
  sourceRef:
    kind: GitRepository
    name: tenant-enrollments
    namespace: flux-system
  serviceAccountName: platform-reconciler
  prune: false
  force: false
  wait: true
  commonMetadata:
    annotations:
      platform.perkforge.io/foundation-sha256: 402b9fe44daf08eb2a4d83eacffc474d559f5e0e079fbffb1b66289bb3b11d8f
  healthCheckExprs:
  - apiVersion: admissionregistration.k8s.io/v1
    kind: ValidatingAdmissionPolicy
    current: has(status.observedGeneration) && status.observedGeneration == metadata.generation
      && has(status.typeChecking) && (!has(status.typeChecking.expressionWarnings)
      || status.typeChecking.expressionWarnings.size() == 0)
