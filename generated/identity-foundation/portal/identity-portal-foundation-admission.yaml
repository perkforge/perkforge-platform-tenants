apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: identity-portal-foundation-admission
  namespace: flux-system
spec:
  interval: 5m
  timeout: 5m
  path: ./generated/identity-foundation/portal/admission
  sourceRef:
    kind: GitRepository
    name: tenant-enrollments
    namespace: flux-system
  serviceAccountName: platform-reconciler
  prune: false
  force: false
  wait: true
  commonMetadata:
    annotations:
      platform.perkforge.io/foundation-sha256: 574badef224b80e42cc686dab37de7dbf448974c33f853f7f7d56fedf9f4afdb
  healthCheckExprs:
  - apiVersion: admissionregistration.k8s.io/v1
    kind: ValidatingAdmissionPolicy
    current: has(status) && has(status.observedGeneration) && status.observedGeneration
      == metadata.generation && has(status.typeChecking) && (!has(status.typeChecking.expressionWarnings)
      || status.typeChecking.expressionWarnings.size() == 0)
