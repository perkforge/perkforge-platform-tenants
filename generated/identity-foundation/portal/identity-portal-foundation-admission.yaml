apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: identity-portal-foundation-admission
  namespace: flux-system
spec:
  interval: 5m
  timeout: 5m
  path: ./generated/identity-foundation/portal/admission
  sourceRef:
    kind: GitRepository
    name: tenant-enrollments
    namespace: flux-system
  serviceAccountName: platform-reconciler
  prune: false
  force: false
  wait: true
  commonMetadata:
    annotations:
      platform.perkforge.io/foundation-sha256: dc2a00cc139c22459066c1c066fa6d4026b1e06cf7aea9e90720d95f0d2d61ce
  healthCheckExprs:
  - apiVersion: admissionregistration.k8s.io/v1
    kind: ValidatingAdmissionPolicy
    current: has(status.observedGeneration) && status.observedGeneration == metadata.generation
      && has(status.typeChecking) && (!has(status.typeChecking.expressionWarnings)
      || status.typeChecking.expressionWarnings.size() == 0)
