apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: identity-portal-foundation-controls
  namespace: flux-system
spec:
  interval: 5m
  timeout: 5m
  path: ./generated/identity-foundation/portal/controls
  sourceRef:
    kind: GitRepository
    name: tenant-enrollments
    namespace: flux-system
  serviceAccountName: platform-reconciler
  prune: false
  force: false
  wait: true
  commonMetadata:
    annotations:
      platform.perkforge.io/foundation-sha256: 92897cf081ccdbc80d233b7b9f15f506dcab0d0d3a6fbf11b2a478aac0005094
  dependsOn:
  - name: identity-portal-foundation-admission
    readyExpr: dep.spec.commonMetadata.annotations['platform.perkforge.io/foundation-sha256']
      == self.spec.commonMetadata.annotations['platform.perkforge.io/foundation-sha256']
      && dep.metadata.generation == dep.status.observedGeneration && dep.status.conditions.exists(e,
      e.type == 'Ready' && e.status == 'True')
