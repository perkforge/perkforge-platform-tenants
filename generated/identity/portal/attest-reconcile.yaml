apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: identity-portal-attest
  namespace: flux-system
spec:
  interval: 5m
  timeout: 6m
  path: ./generated/identity/portal/attest
  sourceRef:
    kind: GitRepository
    name: tenant-enrollments
  serviceAccountName: identity-attestor-reconciler
  prune: false
  force: false
  wait: true
  commonMetadata:
    annotations:
      platform.perkforge.io/invocation: 89fa3d6348444b25ede774bebe27287c083b5932d4ea192b4dc5826a7e6191c5
      platform.perkforge.io/attempt: 74a1fd77a43038f577050abc6df5e601b2f6f5e87147de9e855925194120a78c
  healthChecks:
  - apiVersion: batch/v1
    kind: Job
    name: identity-portal-attest-74a1fd77a43038f5
    namespace: tenant-identity-attestor
  suspend: true
  dependsOn:
  - name: identity-portal-foundation
    readyExpr: dep.spec.commonMetadata.annotations['platform.perkforge.io/invocation']
      == self.spec.commonMetadata.annotations['platform.perkforge.io/invocation']
      && dep.spec.commonMetadata.annotations['platform.perkforge.io/attempt'] == self.spec.commonMetadata.annotations['platform.perkforge.io/attempt']
      && dep.metadata.generation == dep.status.observedGeneration && dep.status.conditions.exists(e,
      e.type == 'Ready' && e.status == 'True')
