apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: identity-portal-memberships
  namespace: flux-system
spec:
  interval: 5m
  timeout: 6m
  path: ./generated/identity/portal/memberships
  sourceRef:
    kind: GitRepository
    name: tenant-enrollments
  serviceAccountName: identity-group-reconciler
  prune: false
  force: false
  wait: true
  commonMetadata:
    annotations:
      platform.perkforge.io/invocation: 5d92796ed2fcc186e8a770a13f69916eed814ed1d0bd6e9eb1fa67e61e84bca4
      platform.perkforge.io/attempt: b9c6ab787d54ba270c582d321ce2afb6874293adfb0c40aa3983554fa6bc72ff
  healthChecks:
  - apiVersion: batch/v1
    kind: Job
    name: identity-portal-memberships-b9c6ab787d54ba27
    namespace: tenant-identity-writer
  suspend: false
  dependsOn:
  - name: identity-portal-attest
    readyExpr: dep.spec.commonMetadata.annotations['platform.perkforge.io/invocation']
      == self.spec.commonMetadata.annotations['platform.perkforge.io/invocation']
      && dep.spec.commonMetadata.annotations['platform.perkforge.io/attempt'] == self.spec.commonMetadata.annotations['platform.perkforge.io/attempt']
      && dep.metadata.generation == dep.status.observedGeneration && dep.status.conditions.exists(e,
      e.type == 'Ready' && e.status == 'True')
