apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: nextcloud-reconciler, namespace: tenant-home-nextcloud-config}
rules:
- apiGroups: ['']
  resources: [configmaps]
  verbs: [get, list, watch, create, update, patch]
- apiGroups: [helm.toolkit.fluxcd.io]
  resources: [helmreleases]
  verbs: [get, list, watch, create, update, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: nextcloud-reconciler, namespace: tenant-home-nextcloud-config}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: nextcloud-reconciler}
subjects: [{kind: ServiceAccount, name: nextcloud-reconciler, namespace: tenant-home-nextcloud-config}]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: nextcloud-enrollment, namespace: tenant-home-nextcloud-config}
rules:
- apiGroups: [source.toolkit.fluxcd.io]
  resources: [gitrepositories, helmrepositories]
  verbs: [get, list, watch, create, update, patch]
- apiGroups: [kustomize.toolkit.fluxcd.io]
  resources: [kustomizations]
  verbs: [get, list, watch, create, update, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: nextcloud-enrollment, namespace: tenant-home-nextcloud-config}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: nextcloud-enrollment}
subjects: [{kind: ServiceAccount, name: tenant-enrollment-admin, namespace: flux-system}]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: nextcloud-workloads, namespace: tenant-home-nextcloud}
rules:
- apiGroups: [apps]
  resources: [deployments]
  verbs: [get, list, watch, create, update, patch, delete]
- apiGroups: [batch]
  resources: [cronjobs]
  verbs: [get, list, watch, create, update, patch, delete]
- apiGroups: ['']
  resources: [services, configmaps]
  verbs: [get, list, watch, create, update, patch, delete]
- apiGroups: [networking.k8s.io]
  resources: [ingresses]
  verbs: [get, list, watch, create, update, patch, delete]
- apiGroups: ['']
  resources: [persistentvolumeclaims]
  verbs: [get, list, watch, create, update, patch]
- apiGroups: [postgresql.cnpg.io]
  resources: [clusters]
  verbs: [get, list, watch, create, update, patch]
- apiGroups: ['']
  resources: [pods, events]
  verbs: [get, list, watch]
- apiGroups: [apps]
  resources: [replicasets]
  verbs: [get, list, watch]
- apiGroups: [batch]
  resources: [jobs]
  verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: nextcloud-workloads, namespace: tenant-home-nextcloud}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: nextcloud-workloads}
subjects: [{kind: ServiceAccount, name: nextcloud-deployer, namespace: tenant-home-nextcloud-config}]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: nextcloud-helm-storage, namespace: tenant-home-nextcloud-release}
rules:
- apiGroups: ['']
  resources: [secrets]
  verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: nextcloud-helm-storage, namespace: tenant-home-nextcloud-release}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: nextcloud-helm-storage}
subjects: [{kind: ServiceAccount, name: nextcloud-deployer, namespace: tenant-home-nextcloud-config}]
