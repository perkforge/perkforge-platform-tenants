apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata: {name: nextcloud-releases}
spec:
  failurePolicy: Fail
  matchConstraints:
    namespaceSelector: {matchLabels: {platform.perkforge.io/nextcloud-control: 'true'}}
    resourceRules:
    - apiGroups: [helm.toolkit.fluxcd.io]
      apiVersions: [v2]
      operations: [CREATE, UPDATE]
      resources: [helmreleases]
  validations:
  - expression: >-
      object.metadata.name in ['nextcloud', 'nextcloud-data'] &&
      object.spec.releaseName == object.metadata.name &&
      object.spec.serviceAccountName == 'nextcloud-deployer' &&
      object.spec.targetNamespace == 'tenant-home-nextcloud' &&
      object.spec.storageNamespace == 'tenant-home-nextcloud-release' &&
      !has(object.spec.kubeConfig) && !has(object.spec.chartRef) &&
      !has(object.spec.postRenderers) &&
      (!has(object.spec.install.disableWait) || !object.spec.install.disableWait) &&
      (!has(object.spec.upgrade.disableWait) || !object.spec.upgrade.disableWait) &&
      (!has(object.spec.chart.spec.sourceRef.namespace) || object.spec.chart.spec.sourceRef.namespace == 'tenant-home-nextcloud-config')
    message: Nextcloud retains its scoped deployer, normal waits and protected namespaces.
  - expression: >-
      object.spec.valuesFrom.size() == 2 &&
      object.spec.valuesFrom.all(v, v.kind == 'ConfigMap' && v.valuesKey == 'values.yaml' && !has(v.targetPath)) &&
      (object.metadata.name == 'nextcloud' ?
        object.spec.chart.spec.chart == 'nextcloud' && object.spec.chart.spec.version == '9.4.1' &&
        object.spec.chart.spec.sourceRef.kind == 'HelmRepository' && object.spec.chart.spec.sourceRef.name == 'nextcloud-upstream' &&
        object.spec.valuesFrom.map(v, v.name) == ['nextcloud-defaults', 'nextcloud-cluster'] &&
        object.spec.dependsOn.size() == 1 && object.spec.dependsOn[0].name == 'nextcloud-data' :
        object.spec.chart.spec.chart == './charts/data' &&
        object.spec.chart.spec.sourceRef.kind == 'GitRepository' && object.spec.chart.spec.sourceRef.name == 'tenant-nextcloud' &&
        object.spec.valuesFrom.map(v, v.name) == ['nextcloud-data-defaults', 'nextcloud-data-cluster'])
    message: Only the reviewed chart, source and named values inputs may be selected.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata: {name: nextcloud-releases}
spec: {policyName: nextcloud-releases, validationActions: [Deny]}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata: {name: nextcloud-child}
spec:
  failurePolicy: Fail
  matchConstraints:
    namespaceSelector: {matchLabels: {platform.perkforge.io/nextcloud-control: 'true'}}
    resourceRules:
    - apiGroups: [kustomize.toolkit.fluxcd.io]
      apiVersions: [v1]
      operations: [CREATE, UPDATE]
      resources: [kustomizations]
  validations:
  - expression: >-
      object.metadata.name == 'tenant-nextcloud' && !has(object.spec.kubeConfig) &&
      object.spec.serviceAccountName == 'nextcloud-reconciler' &&
      object.spec.targetNamespace == 'tenant-home-nextcloud-config' &&
      object.spec.path == './gitops/clusters/local' && !object.spec.prune &&
      object.spec.sourceRef.kind == 'GitRepository' && object.spec.sourceRef.name == 'tenant-nextcloud' &&
      (!has(object.spec.sourceRef.namespace) || object.spec.sourceRef.namespace == 'tenant-home-nextcloud-config') &&
      !has(object.spec.patches) && !has(object.spec.postBuild) && !has(object.spec.components)
    message: The child cannot override the scoped app source, path or rendered content.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata: {name: nextcloud-child}
spec: {policyName: nextcloud-child, validationActions: [Deny]}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata: {name: nextcloud-sources}
spec:
  failurePolicy: Fail
  matchConstraints:
    namespaceSelector: {matchLabels: {platform.perkforge.io/nextcloud-control: 'true'}}
    resourceRules:
    - apiGroups: [source.toolkit.fluxcd.io]
      apiVersions: [v1]
      operations: [CREATE, UPDATE]
      resources: [gitrepositories]
  validations:
  - expression: >-
        object.metadata.name == 'tenant-nextcloud' &&
        object.spec.url == 'https://github.com/perkforge/perkforge-tenant-nextcloud.git' &&
        (!has(object.spec.secretRef) || object.spec.secretRef.name == 'nextcloud-source-read') &&
        !has(object.spec.ref.branch) && !has(object.spec.ref.semver) && !has(object.spec.ref.commit) &&
        (object.spec.ref.tag.matches('^v[0-9]+[.][0-9]+[.][0-9]+$') ||
          (object.spec.ref.tag == 'UNCONFIGURED' && object.spec.suspend))
    message: Source selection requires the reviewed repository and a published exact release before resume.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata: {name: nextcloud-sources}
spec: {policyName: nextcloud-sources, validationActions: [Deny]}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata: {name: nextcloud-chart-source}
spec:
  failurePolicy: Fail
  matchConstraints:
    namespaceSelector: {matchLabels: {platform.perkforge.io/nextcloud-control: 'true'}}
    resourceRules:
    - apiGroups: [source.toolkit.fluxcd.io]
      apiVersions: [v1]
      operations: [CREATE, UPDATE]
      resources: [helmrepositories]
  validations:
  - expression: object.metadata.name == 'nextcloud-upstream' && object.spec.url == 'https://nextcloud.github.io/helm/'
    message: Only the reviewed public chart repository may be selected.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata: {name: nextcloud-chart-source}
spec: {policyName: nextcloud-chart-source, validationActions: [Deny]}
