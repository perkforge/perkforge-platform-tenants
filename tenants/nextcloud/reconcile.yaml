apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata: {name: tenant-nextcloud}
spec:
  suspend: true
  interval: 5m
  timeout: 5m
  path: ./gitops/clusters/local
  sourceRef: {kind: GitRepository, name: tenant-nextcloud}
  targetNamespace: tenant-home-nextcloud-config
  serviceAccountName: nextcloud-reconciler
  prune: false
  wait: true
