# Trusted platform enrollment parent; tenant Git cannot modify this foundation.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: portal-enrollment, namespace: tenant-portal-config}
rules:
- apiGroups: [source.toolkit.fluxcd.io]
  resources: [gitrepositories]
  verbs: [get, list, watch, create, update, patch]
- apiGroups: [kustomize.toolkit.fluxcd.io]
  resources: [kustomizations]
  verbs: [get, list, watch, create, update, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: portal-enrollment, namespace: tenant-portal-config}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: portal-enrollment}
subjects:
- {kind: ServiceAccount, name: tenant-enrollment-admin, namespace: flux-system}
