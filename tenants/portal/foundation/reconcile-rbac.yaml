apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: portal-reconciler, namespace: tenant-portal-config}
rules:
- apiGroups: ['']
  resources: [configmaps]
  verbs: [get, list, watch, create, update, patch]
- apiGroups: [helm.toolkit.fluxcd.io]
  resources: [helmreleases]
  verbs: [get, list, watch, create, update, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: portal-reconciler, namespace: tenant-portal-config}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: portal-reconciler}
subjects:
- {kind: ServiceAccount, name: portal-reconciler, namespace: tenant-portal-config}
