apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata: {name: portal-reconciliation-boundary}
spec:
  failurePolicy: Fail
  matchConstraints:
    namespaceSelector: {matchLabels: {platform.perkforge.io/portal-control: 'true'}}
    resourceRules:
    - apiGroups: [helm.toolkit.fluxcd.io]
      apiVersions: [v2]
      operations: [CREATE, UPDATE]
      resources: [helmreleases]
  validations:
  - expression: >-
      !has(object.spec.kubeConfig) && object.spec.serviceAccountName == 'portal-deployer' &&
      object.metadata.name == 'portal' && object.spec.targetNamespace == 'tenant-portal' &&
      object.spec.storageNamespace == 'tenant-portal-release' && object.spec.releaseName == 'portal'
    message: Portal reconcilers must retain their scoped identity and namespaces.
  - expression: >-
      !has(object.spec.chartRef) && !has(object.spec.postRenderers) &&
       object.spec.chart.spec.chart == './bundles/portal/chart' &&
       object.spec.chart.spec.sourceRef.kind == 'GitRepository' &&
       object.spec.chart.spec.sourceRef.name == 'tenant-portal' &&
       (!has(object.spec.chart.spec.sourceRef.namespace) || object.spec.chart.spec.sourceRef.namespace == 'tenant-portal-config') &&
       object.spec.valuesFrom.size() == 4 &&
       object.spec.valuesFrom.all(v, v.kind == 'ConfigMap' && v.valuesKey == 'values.yaml') &&
       object.spec.valuesFrom.map(v, v.name) == ['portal-defaults', 'portal-environment', 'portal-profile', 'portal-cluster']
    message: Portal releases retain the protected chart and named value sources; runtime admission checks rendered security settings.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata: {name: portal-reconciliation-boundary}
spec:
  policyName: portal-reconciliation-boundary
  validationActions: [Deny]
