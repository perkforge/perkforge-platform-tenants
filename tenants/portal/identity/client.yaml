# Native Keycloak body; secret lookup runs only inside the approved no_log block.
clientId: portal-local
name: Local Portal
enabled: true
protocol: openid-connect
clientAuthenticatorType: client-secret
publicClient: false
secret: "{{ lookup('ansible.builtin.file', portal_private_dir ~ '/client-secret') | trim }}"
standardFlowEnabled: true
implicitFlowEnabled: false
directAccessGrantsEnabled: false
serviceAccountsEnabled: false
fullScopeAllowed: false
redirectUris: [https://portal-local-il2.local-lab.test/auth/callback]
webOrigins: [https://portal-local-il2.local-lab.test]
defaultClientScopes: [profile]
optionalClientScopes: []
attributes:
  perkforge-managed-by: platform-tenants/local-portal
  pkce.code.challenge.method: S256
  id.token.signed.response.alg: RS256
  access.token.signed.response.alg: RS256
  access.token.lifespan: '300'
protocolMappers:
- name: portal-groups
  protocol: openid-connect
  protocolMapper: oidc-group-membership-mapper
  consentRequired: false
  config:
    claim.name: groups
    full.path: 'true'
    id.token.claim: 'false'
    access.token.claim: 'true'
    userinfo.token.claim: 'false'
- name: portal-audience
  protocol: openid-connect
  protocolMapper: oidc-audience-mapper
  consentRequired: false
  config:
    included.client.audience: portal-local
    userinfo.token.claim: 'false'
    id.token.claim: 'false'
    access.token.claim: 'true'
- name: portal-api-role
  protocol: openid-connect
  protocolMapper: oidc-usermodel-client-role-mapper
  consentRequired: false
  config:
    usermodel.clientRoleMapping.clientId: portal-local
    userinfo.token.claim: 'false'
    claim.name: resource_access.portal-local.roles
    jsonType.label: String
    multivalued: 'true'
    id.token.claim: 'false'
    access.token.claim: 'true'
