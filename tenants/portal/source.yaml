# Platform-owned enrollment of the tenant-owned application repository.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: tenant-portal
spec:
  suspend: true
  interval: 10m
  url: https://github.com/perkforge/perkforge-tenant-portal.git
  ref:
    # Published configuration release; resolved source evidence is separate.
    tag: v1.0.0
  secretRef:
    name: portal-source-read # Scoped read reference only; not provisioned.
