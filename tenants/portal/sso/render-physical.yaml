# Public configuration only. Render is not activation or credential provisioning.
- name: Render physical Portal trust routing and scoped ESO input
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    portal_physical_render: false
    portal_ingress_pod_egress: false
    portal_ingress_pod_tls_port: 8443
  tasks:
  - ansible.builtin.assert:
      that:
      - portal_physical_render | bool
      - portal_physical_output is match('^/[A-Za-z0-9_./-]+$')
      - portal_physical_output == (portal_physical_output | realpath)
      - portal_hostname is match('^[a-z0-9][a-z0-9.-]+$')
      - portal_bao_server is match('^https://[a-z0-9.-]+(:[0-9]+)?$')
      - portal_issuer_ipv4 is match('^([0-9]{1,3}[.]){3}[0-9]{1,3}$')
      - portal_ingress_pod_tls_port | int > 0
      - portal_ingress_pod_tls_port | int <= 65535
      - portal_public_ca_sha256 is match('^[a-f0-9]{64}$')
  - ansible.builtin.command:
      argv: [python3, -c, 'import ipaddress,sys; ipaddress.IPv4Address(sys.argv[1])', '{{ portal_issuer_ipv4 }}']
    changed_when: false
  - ansible.builtin.stat:
      path: '{{ portal_public_ca_file }}'
      follow: false
      checksum_algorithm: sha256
    register: public_ca
  - ansible.builtin.assert:
      that:
      - public_ca.stat.isreg | default(false)
      - not (public_ca.stat.islnk | default(false))
      - public_ca.stat.checksum == portal_public_ca_sha256
      - "'PRIVATE KEY' not in lookup('file', portal_public_ca_file)"
      - "'BEGIN CERTIFICATE' in lookup('file', portal_public_ca_file)"
  - ansible.builtin.command:
      argv: [openssl, x509, -in, '{{ portal_public_ca_file }}', -noout, -checkend, '0']
    changed_when: false
  - ansible.builtin.file:
      path: '{{ portal_physical_output }}'
      state: directory
      mode: '0700'
  - ansible.builtin.template:
      src: physical-boundary.yaml.j2
      dest: '{{ portal_physical_output }}/public-boundary.yaml'
      mode: '0600'
  - name: Render existing scoped ESO foundation and three consumer declarations
    ansible.builtin.command:
      argv: [kubectl, kustomize, '{{ playbook_dir }}/../{{ item }}']
    loop: [eso, eso-consumers]
    register: manifests
    changed_when: false
  - name: Substitute only the operator-selected provider origin
    ansible.builtin.copy:
      dest: '{{ portal_physical_output }}/{{ item.item }}.yaml'
      mode: '0600'
      content: |
        {% for document in item.stdout | from_yaml_all | select | list %}
        ---
        {% if document.kind == 'SecretStore' %}
        {{ document | combine({'spec': {'provider': {'vault': {'server': portal_bao_server}}}}, recursive=true) | to_nice_yaml }}
        {% else %}
        {{ document | to_nice_yaml }}
        {% endif %}
        {% endfor %}
    loop: '{{ manifests.results }}'
